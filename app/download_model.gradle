// Downloads a pretrained object-detection model at build time into
// app/src/main/assets/detect.tflite.
//
// This is EfficientDet-Lite2 from Google's official TensorFlow Lite model
// collection (the same file the official TensorFlow object-detection Android
// sample uses). Two things matter about this particular file:
//
//  1. It has embedded metadata, which includes its own label map. The TFLite
//     Task Library reads those labels straight out of the model, so there is
//     no separate labelmap.txt to index by hand -- that hand-indexing is what
//     used to make cars report as "bicycle"/"motorcycle".
//  2. It is considerably more accurate than the old SSD-MobileNet-v1 model,
//     which matters for objects in screen-captured, re-compressed video.
//
// Note this task now FAILS the build if the download does not work. The
// previous version only printed a warning, which meant a silent download
// failure would produce an app that simply never detected anything.

def modelUrl = 'https://storage.googleapis.com/download.tensorflow.org/models/tflite/task_library/object_detection/android/lite-model_efficientdet_lite2_detection_metadata_1.tflite'
def assetsDir = new File(projectDir, 'src/main/assets')
def modelFile = new File(assetsDir, 'detect.tflite')

tasks.register('downloadDetectionModel') {
          doLast {
                        if (modelFile.exists() && modelFile.length() > 100000) {
                                          println "AerialGuard: detection model already present (${modelFile.length()} bytes), skipping download."
                                          return
                        }
                        println "AerialGuard: downloading detection model from ${modelUrl} ..."
                        assetsDir.mkdirs()
                        new URL(modelUrl).withInputStream { input ->
                                          modelFile.withOutputStream { output -> output << input }
                        }
                        def size = modelFile.exists() ? modelFile.length() : 0
                        if (size < 100000) {
                                          throw new GradleException("AerialGuard: model download failed -- got ${size} bytes from ${modelUrl}")
                        }
                        println "AerialGuard: model ready at ${modelFile} (${size} bytes)"
          }
}

tasks.matching { it.name == 'preBuild' }.configureEach {
          dependsOn 'downloadDetectionModel'
}

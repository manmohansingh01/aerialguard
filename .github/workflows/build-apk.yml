name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch converted military model
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 33158909087 --repo ${{ github.repository }} --name military-model --dir milmodel

        run: python3 -c "import shutil,glob; f=glob.glob('milmodel/**/*.tflite',recursive=True); print(f); shutil.copy(f[0],'app/src/main/assets/military.tflite') if f else print('no model found')"
        continue-on-error: true
        run: python3 -c "import shutil,glob; f=glob.glob(chr(39)+chr(39)); import sys" || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NS-Netra-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
